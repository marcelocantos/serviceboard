targets:
  T1:
    name: The local dashboard shows and controls Supervisor and Homebrew services with logs and service-provided views
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Live journey passed against isolated supervisord: inventory, stdout, stderr, stop, start, CSRF rejection, and service dashboard manifest. Deployed Serviceboard is RUNNING under Supervisor; live API shows 27 services across both sources with no errors, and live Ollama stdout loaded. Desktop browser rendering reviewed; 390px viewport had no horizontal overflow. Homebrew actions were not exercised on daily services to avoid interruption; command dispatch uses a live inventory name.'
    acceptance:
    - A browser connected to 127.0.0.1 shows current Supervisor and Homebrew service status, separate log tabs where available, and individual start, stop, and restart controls.
    - An isolated live Supervisor journey exercises status, stdout, stderr, stop, start, and a versioned service dashboard manifest without changing daily services.
    - The dashboard is checked in a real browser at desktop and narrow viewport sizes, with no horizontal overflow.
    context: |-
      Initial local milestone for the dashboard. Homebrew control commands have an explicit verification exception: the test suite does not start or stop the owner's installed services.

      Achieved 2026-09-23: Live journey passed against isolated supervisord: inventory, stdout, stderr, stop, start, CSRF rejection, and service dashboard manifest. Deployed Serviceboard is RUNNING under Supervisor; live API shows 27 services across both sources with no errors, and live Ollama stdout loaded. Desktop browser rendering reviewed; 390px viewport had no horizontal overflow. Homebrew actions were not exercised on daily services to avoid interruption; command dispatch uses a live inventory name.
    origin: user request
    discovered: 2026-09-23
    achieved: 2026-09-23
  T2:
    name: Service search supports focused keyboard navigation and predictable Enter and Escape selection
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '`make bullseye` passed from the updated checkout, including a headless Chromium journey against isolated real supervisord. The journey confirms search focus, 12 running services ahead of a stopped service, Arrow Down/Up with search focused, Enter clearing search while keeping a stopped selection in view, Escape restoring the last empty-search selection, and 390px no-overflow. Manual live-browser review on the deployed service confirmed focus and running-first ordering across Supervisor and Homebrew.'
    acceptance:
    - Search has focus after the dashboard loads.
    - Running services precede stopped services in the visible inventory, including when source filters or search are applied.
    - Arrow Up and Arrow Down move the selected service through the visible results while the search field has focus and keep the selected row in view.
    - Enter clears an active search while preserving the current selection and scrolling its row into view; Escape clears it and restores the selection held when the search was empty.
    context: |-
      User requested keyboard-first service navigation and clear search dismissal semantics.

      Achieved 2026-09-23: `make bullseye` passed from the updated checkout, including a headless Chromium journey against isolated real supervisord. The journey confirms search focus, 12 running services ahead of a stopped service, Arrow Down/Up with search focused, Enter clearing search while keeping a stopped selection in view, Escape restoring the last empty-search selection, and 390px no-overflow. Manual live-browser review on the deployed service confirmed focus and running-first ordering across Supervisor and Homebrew.
    origin: manual
    discovered: 2026-09-23
    achieved: 2026-09-23
  T3:
    name: Search dismissal keeps keyboard focus in the search box
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '`make bullseye` passed, including the Chromium journey against an isolated real Supervisor instance with explicit search-focus assertions after Enter and Escape. Manual check on the deployed Serviceboard confirmed both keys clear search and leave the input focused; Enter kept the selected Homebrew service and Escape restored the pre-search selection.'
    acceptance:
    - After Enter clears an active search, the search box remains focused and the current service selection remains visible.
    - After Escape cancels an active search, the search box remains focused and the selection from before the search is restored.
