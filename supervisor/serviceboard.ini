; Sample Serviceboard instance. Include this file from the checkout:
; %(here)s is this directory, so directory is the repo root.
; Change command if Python is not at ~/.py/bin/python3.
[program:serviceboard]
command=%(ENV_HOME)s/.py/bin/python3 -m serviceboard --port 8767 --event-socket /opt/homebrew/var/run/serviceboard-events.sock
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/.local/var/log/serviceboard.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[eventlistener:serviceboard-events]
command=%(ENV_HOME)s/.py/bin/python3 -u -m serviceboard.events --socket /opt/homebrew/var/run/serviceboard-events.sock
directory=%(here)s/..
events=PROCESS_STATE
autostart=false
autorestart=true
startsecs=0
buffer_size=100
stderr_logfile=%(ENV_HOME)s/.local/var/log/serviceboard-events.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
