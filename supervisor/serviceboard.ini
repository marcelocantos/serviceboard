; Local-only Serviceboard instance for this Mac.
[program:serviceboard]
command=/Users/marcelo/.py/bin/python3 -m serviceboard --port 8767
directory=/Users/marcelo/work/github.com/marcelocantos/serviceboard
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/.local/var/log/serviceboard.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
